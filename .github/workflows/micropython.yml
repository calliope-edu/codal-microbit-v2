name: Build MicroPython

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'

jobs:
  build-micropython:
    runs-on: ubuntu-22.04
    name: Build MicroPython
    steps:
      - name: Clone MicroPython for Calliope mini 3
        uses: actions/checkout@v4
        with:
          repository: 'calliope-edu/micropython-calliope-mini-v3'
          ref: 'oct24-mini3'
          submodules: 'true'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone this repository in the lib/codal/libraries folder
        uses: actions/checkout@v4
        with:
          path: lib/codal/libraries/codal-microbit-v2
          fetch-depth: '0'
          submodules: 'recursive'
      - name: Setup arm-none-eabi-gcc v10.3
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: 10.3-2021.10
      - name: Install CMake v3.28 via PyPI
        run: python -m pip install cmake==3.28.3
      - name: Check Versions
        run: |
          arm-none-eabi-gcc --version
          cmake --version
          python --version
      - name: Modify codal.json to use this codal-microbit-v2 commit
        shell: bash
        run: |
          python - << EOF
          import os, json, collections

          with open('src/codal_app/codal.json', 'r') as f:
              codal_json = json.loads(f.read(), object_pairs_hook=collections.OrderedDict)

          try:
              target_url = codal_json['target']['url']
              if not target_url.endswith('/codal-microbit-v2'):
                  print(f"Unexpected target URL value: {target_url}")
                  exit(1)
              # Just need to check this exists, we don't care about the value
              _ = codal_json['target']['branch']
          except KeyError:
              print('The src/codal_app/codal.json structure has changed and expected keys are not found.')
              exit(1)
          else:
              codal_json['target']['url'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
              codal_json['target']['branch'] = os.environ['GITHUB_SHA']

          with open('src/codal_app/codal.json', 'w') as f:
              f.write(json.dumps(codal_json, indent=4))
          EOF
          git diff src/codal_app/codal.json
      - name: Build MicroPython
        run: |
          make -C lib/micropython/mpy-cross -j4
          cd src
          make -j4
      - name: Upload hex file
        uses: actions/upload-artifact@v4
        with:
          name: micropython-${{ github.sha }}.hex
          path: src/MICROBIT.hex
